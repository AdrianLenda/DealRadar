[project]
name = "dealradar"
version = "0.1.0"
description = "Deterministic (no-LLM) detector of real price discounts and value-for-money across online stores."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.6",
    "scikit-learn>=1.4",
    "lxml>=5.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
    "lxml-stubs>=0.5",
]

[project.scripts]
dealradar = "dealradar.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dealradar = ["migrations/*.sql", "py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/dealradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
