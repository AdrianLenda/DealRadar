# DealRadar matcher configuration (owner: A3, see prompty/A3-matcher.md and ARCHITEKTURA.md section 7).
#
# Acceptance thresholds live here, not in code, so they can be retuned from the eval report
# (`dealradar match --eval`) without touching src/dealradar/matching/. Z5: precision is optimized
# first; if the eval report shows precision < 0.97 at a threshold, raise the threshold and accept
# lower recall -- never the other way around.

ean:
  confidence: 0.99
  # Two offers sharing an EAN but with title_norm similarity below this are almost always a shop
  # that pasted the manufacturer's EAN onto the wrong variant. Logged to match_review as 'conflict'
  # instead of merged.
  conflict_title_sim_min: 0.30

brand_mpn:
  confidence: 0.95
  # An MPN shorter than this is not a real identifier ("A1", "V2") -- step 2 ignores it.
  mpn_min_length: 4

fuzzy:
  # Blocking key price window: only compare offers whose prices are within +/-35% of each other.
  price_bucket_pct: 0.35
  # Weights for the three similarity signals (must sum to 1.0; enforced at load time).
  weight_tfidf: 0.4
  weight_token_set_ratio: 0.3
  weight_attr_agreement: 0.3
  # combined_score >= accept_threshold -> merge. This is the single most important number in the
  # whole matcher; see the A3 final report for the precision/recall sweep across candidate
  # thresholds that justified this value (0.55 was the lowest threshold that still cleared the
  # Z5 precision target of 0.97 on the labeled eval set -- lower recall was accepted, not precision).
  accept_threshold: 0.55
  # Reported confidence is combined_score rescaled into [min_confidence, max_confidence] per
  # ARCHITEKTURA.md section 7 ("confidence 0.60-0.85").
  min_confidence: 0.60
  max_confidence: 0.85

# Gate G2 (ARCHITEKTURA.md F2 / Z5): numeric attributes extracted from title_norm that both offers
# share must agree, or the pair is rejected regardless of text similarity -- on every cascade step,
# not just step 3.
attribute_gate:
  # Zero tolerance: these must match exactly (capacity, resolution, unit counts).
  exact_keys:
    - capacity_gb
    - capacity_wh
    - capacity_mah
    - quantity
    - resolution_w
    - resolution_h
    - refresh_hz
    - voltage_v
    # Generation/model digits after a recognized product line ("iPhone 15" vs "iPhone 13", "RTX
    # 4070" vs "RTX 4060") -- added after the A3 eval found TF-IDF+token_set_ratio alone cannot
    # tell two generations of the same phone/GPU/CPU line apart when the rest of the title matches.
    - model_number
    # Battery/cell type code (AA vs AAA vs 9V vs CR2032...) -- same failure class as model_number,
    # found reviewing real cluster output: "Baterie Duracell AA" vs "...AAA" differ by one character.
    - battery_size
  # +/-2% tolerance: physical dimensions and mass, which legitimately round differently between
  # shops (74.0 Wh vs 74 Wh is fine; 512 GB vs 1024 GB is not).
  tolerance_pct_keys:
    weight_kg: 0.02
    length_m: 0.02
    width_m: 0.02
    height_m: 0.02
    diagonal_in: 0.02
    power_w: 0.02

cluster:
  # A cluster this large is almost certainly a matching bug, not a popular product -- flagged in
  # the run report for manual inspection rather than silently accepted.
  max_size_warn: 50

eval:
  candidate_pairs_min: 200
  # Score bands used to stratify the starter match_review dataset. Most pairs should land in
  # 0.5-0.8, where the accept/reject decision actually has to do work.
  score_bands:
    - [0.0, 0.3]
    - [0.3, 0.5]
    - [0.5, 0.65]
    - [0.65, 0.8]
    - [0.8, 0.95]
    - [0.95, 1.01]
  # Target share of the starter dataset drawn from each band (does not need to sum exactly to 1.0
  # if a band does not have enough candidates; leftover slots are redistributed to 0.5-0.8).
  target_band_share:
    "0.0-0.3": 0.10
    "0.3-0.5": 0.10
    "0.5-0.65": 0.25
    "0.65-0.8": 0.25
    "0.8-0.95": 0.20
    "0.95-1.01": 0.10
